name: Tests
on:
  workflow_call:
defaults:
  run:
    working-directory: src/frontend
jobs:
  test:
    name: Test & Coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'src/frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Enforce coverage threshold
        run: |
          node - <<'NODE'
          const fs = require('fs');

          const summary = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8')).total;
          const thresholds = {
            lines: 80,
            functions: 80,
            branches: 70,
            statements: 80,
          };

          const failures = Object.entries(thresholds).filter(([metric, threshold]) => summary[metric].pct < threshold);

          if (failures.length > 0) {
            for (const [metric, threshold] of failures) {
              console.error(`${metric} coverage ${summary[metric].pct}% is below ${threshold}%`);
            }

            process.exit(1);
          }
          NODE

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/